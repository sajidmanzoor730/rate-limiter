[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratelimiter"
version = "0.1.0"
description = "Thread-safe rate limiting algorithms (token bucket, sliding window, fixed window) with zero runtime dependencies."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
